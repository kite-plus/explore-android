name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs these checks before it builds anything to ship.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  check:
    name: Check
    # Pinned: a runner image that changes underneath turns CI red with no
    # commit to blame.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-37.0 build-tools;36.1.0 platform-tools

      # Also checks that the Gradle wrapper is the one Gradle published.
      - uses: gradle/actions/setup-gradle@v6

      - name: Review
        run: python3 scripts/check-comments.py app/src build.gradle.kts settings.gradle.kts app/build.gradle.kts

      # Lint fails on a string without Chinese, among its other errors.
      - name: Lint
        run: ./gradlew lintDebug

      - name: Test
        run: ./gradlew testDebugUnitTest

      # The checks above build Debug; this catches what breaks only with
      # code shrinking in Release.
      - name: Release build
        run: ./gradlew assembleRelease
